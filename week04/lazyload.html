<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A webpage with multiple images stacked vertically in a single page, with the images applying lazy loading.">
    <meta name="author" content="Tendayi Gabriel Mazvomba">
    <title>Lazy loading Images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>

</head>

<body>
    <main>
        <h1>Lazy Loading Images</h1>
        <img src="images/dog-one.webp" alt="Photo of two dogs resting." loading="lazy" width="400" height="600">
        height="600">
        <img src="images/dog-three.webp" alt="Photo of two dogs playing." loading="lazy" width="400" height="600">
        <img src="images/dog-four.webp" alt="Photo of dog resting on a rock." loading="lazy" width="400" height="600">
        <img src="images/dog-five.webp" alt="Photo of dog puppies staring in the sky." loading="lazy" width="400"
            height="600">
        <img src="images/dog-six.webp" alt="Photo of dogs in the cold." loading="lazy" width="400" height="600">

    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> | Tendayi Gabriel Mazvomba | Zimbabwe
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
